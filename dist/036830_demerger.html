    document.title=L.page_title;$('#pageTitle').textContent=L.page_title;$('#eyebrow').textContent=L.eyebrow;$('#pageH1').innerHTML=L.h1;$('#pageSub').textContent=L.sub;$('#verdictHead').textContent=L.verdict_head;
    $('#stageIntro').textContent=`${J(BL,'은','는')} 분할 전 가치의 출발점이고, 시초가와 종가는 시장이 다시 붙인 가격이다.`;
    $('#stageNote').textContent=L.stage_note;$('#modeEval').textContent=`${BL} = 100`;
    $('#legend').innerHTML=[[HN,'holding'],[ON,'operating'],['기존 주주 합산가치','bundle'],[BM,'benchmark']].map(x=>`<span><i class="swatch" style="background:var(--${x[1]})"></i>${esc(x[0])}</span>`).join('');
    $('#checkpointIntro').textContent=`${BL} 기준은 분할 반응을, 첫 종가 기준은 재상장일에 실제 매수한 후의 성과를 보여준다.`;
    $('#checkpointHead').innerHTML=`<tr><th>시점</th><th>일자</th><th>${esc(HN)}<br>${esc(BL)} 대비</th><th>${esc(ON)}<br>${esc(BL)} 대비</th><th>합산가치<br>${esc(BL)} 대비</th><th>합산가치<br>첫 종가 대비</th><th>${esc(BM)}<br>첫 종가 대비</th><th>합산 초과수익</th></tr>`;
    $('#takeawayIntro').textContent=`${M.name} 한 건으로 확인한 가설의 적용 범위`;
    $('#takeaways').innerHTML=(M.takeaways||[]).map(x=>`<li>${x}</li>`).join('');
    $('#rules').innerHTML=(M.rules||[]).map(x=>`<li>${x}</li>`).join('');
    $('#formula').innerHTML=L.formula;$('#limitNote').textContent=L.baseline_note;$('#foot').textContent=L.footer;
    const d0=D.checkpoints[0],dL=D.checkpoints[D.checkpoints.length-1],d250=dL;
    $('#kpis').innerHTML=[
      [`${HN}(${L.holding_role}) · ${BL}→첫 종가`,pct(d0.holdingFromEvaluation),`${won(S.holding_evaluation_price)} → ${won(d0.holdingClose)}`,'holding'],
      [`${ON}(${L.operating_role}) · ${BL}→첫 종가`,pct(d0.operatingFromEvaluation),`${won(S.operating_evaluation_price)} → ${won(d0.operatingClose)}`,'operating'],
      ['기존 주주 합산가치 · 첫날',pct(d0.bundleFromEvaluation),'분할비율 가중','bundle'],
      [`첫 종가 → D+${dL.day}`,`${pct(dL.operatingFromFirstClose)} / ${pct(dL.holdingFromFirstClose)}`,`${esc(ON)} / ${esc(HN)}`,'operating']
    ].map(x=>`<div class="kpi"><div class="k">${x[0]}</div><div class="v num ${x[3]}">${x[1]}</div><div class="n">${x[2]}</div></div>`).join('');
    $('#stages').innerHTML=D.stages.map(x=>`<article class="stage"><h3>${x.label}</h3><dl><dt>${esc(HN)}</dt><dd class="num ${cls(x.holdingReturn)}">${won(x.holding)} · ${pct(x.holdingReturn)}</dd><dt>${esc(ON)}</dt><dd class="num ${cls(x.operatingReturn)}">${won(x.operating)} · ${pct(x.operatingReturn)}</dd><dt class="sum">기존 주주 합산가치</dt><dd class="sum num ${cls(x.bundleReturn)}">${won(x.bundle)} · ${pct(x.bundleReturn)}</dd></dl></article>`).join('');
    $('#checkpointRows').innerHTML=D.checkpoints.map(x=>`<tr><td><strong>D+${x.day}</strong></td><td class="num">${x.date}</td><td class="num ${cls(x.holdingFromEvaluation)}">${pct(x.holdingFromEvaluation)}</td><td class="num ${cls(x.operatingFromEvaluation)}">${pct(x.operatingFromEvaluation)}</td><td class="num ${cls(x.bundleFromEvaluation)}">${pct(x.bundleFromEvaluation)}</td><td class="num ${cls(x.bundleFromFirstClose)}">${pct(x.bundleFromFirstClose)}</td><td class="num ${cls(x.kosdaqFromFirstClose)}">${pct(x.kosdaqFromFirstClose)}</td><td class="num ${cls(x.bundleExcessFromFirstClose)}">${pct(x.bundleExcessFromFirstClose)}p</td></tr>`).join('');
    const events=M.timeline||[[S.announcement_date,'분할 결정','인적분할 공시'],[S.suspension_start,'매매 정지',''],[S.split_date,'분할기일',''],[S.relist_date,'변경상장·재상장','두 종목 매매 재개']];
    $('#timeline').innerHTML=events.map(x=>`<div class="event"><time class="num">${x[0]}</time><strong>${x[1]}</strong><span>${x[2]}</span></div>`).join('');
    $('#sources').innerHTML=M.sources.map(x=>`<li><a href="${esc(x.url)}" target="_blank" rel="noreferrer">${esc(x.label)}</a><span>${esc(x.note)}</span></li>`).join('');

    let mode='evaluation';const colors={holding:'var(--holding)',operating:'var(--operating)',bundle:'var(--bundle)',kosdaq:'var(--benchmark)'};
    function draw(){
      const data=mode==='evaluation'?D.evaluationIndex:D.firstCloseIndex,series=[['holding',HN],['operating',ON],['bundle','합산가치'],['kosdaq',BM]];
      const all=series.flatMap(([k])=>data[k]),lo=Math.min(...all),hi=Math.max(...all),pad=(hi-lo)*.07||10,min=lo-pad,max=hi+pad,x0=58,x1=1015,y0=18,y1=360,n=D.dates.length;
      const x=i=>x0+(x1-x0)*i/(n-1),y=v=>y1-(v-min)/(max-min)*(y1-y0),path=a=>a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
      const step=max-min>300?100:max-min>180?50:25,start=Math.ceil(min/step)*step;let svg='';
      for(let v=start;v<=max;v+=step){svg+=`<line x1="${x0}" y1="${y(v)}" x2="${x1}" y2="${y(v)}" stroke="var(--border)"/><text x="${x0-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted-foreground)">${Math.round(v)}</text>`}
      [0,60,120,250,n-1].filter((v,i,a)=>v<n&&a.indexOf(v)===i).forEach(i=>{svg+=`<line x1="${x(i)}" y1="${y0}" x2="${x(i)}" y2="${y1}" stroke="var(--border)" stroke-dasharray="2 4"/><text x="${x(i)}" y="${y1+22}" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">${D.dates[i].slice(0,7)}</text>`});
      svg+=`<line x1="${x0}" y1="${y(100)}" x2="${x1}" y2="${y(100)}" stroke="var(--strong)" stroke-dasharray="4 4" opacity=".45"/>`;
      series.forEach(([k])=>svg+=`<path d="${path(data[k])}" fill="none" stroke="${colors[k]}" stroke-width="${k==='bundle'?2.8:2}" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`);
      svg+=`<line id="cross" x1="0" y1="${y0}" x2="0" y2="${y1}" stroke="var(--strong)" opacity="0"/><rect id="hit" x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="transparent"/>`;$('#chart').innerHTML=svg;
      $('#chartDescription').textContent=mode==='evaluation'?`${J(BL,'을','를')} 100으로 놓고 가격발견의 방향을 본다.`:'재상장일 종가를 100으로 놓고 실제 매수 이후의 투자성과를 본다.';
      $('#chartNote').textContent=mode==='evaluation'?`주의: ${J(BM,'은','는')} 재상장일 종가=100이다. 두 주식은 ${BL}=100으로 분할 즉시 재평가를 포함한다.`:`모든 계열을 ${S.relist_date} 종가=100으로 맞춰 이후 성과를 같은 기준으로 비교한다.`;
      const hit=$('#hit'),cross=$('#cross'),tip=$('#tip');hit.addEventListener('mousemove',e=>{const r=$('#chart').getBoundingClientRect(),i=Math.max(0,Math.min(n-1,Math.round((e.clientX-r.left)/r.width*(n-1)))),xx=x(i);cross.setAttribute('x1',xx);cross.setAttribute('x2',xx);cross.setAttribute('opacity','1');tip.innerHTML=`<strong class="num">${D.dates[i]}</strong><br>${esc(HN)} ${data.holding[i].toFixed(1)} · ${esc(ON)} ${data.operating[i].toFixed(1)}<br>합산 ${data.bundle[i].toFixed(1)} · ${esc(BM)} ${data.kosdaq[i].toFixed(1)}`;tip.style.display='block';tip.style.left=Math.min(innerWidth-220,e.clientX+12)+'px';tip.style.top=Math.max(8,e.clientY-72)+'px'});hit.addEventListener('mouseleave',()=>{cross.setAttribute('opacity','0');tip.style.display='none'});
    }
    document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw()}));draw();
    $('#headerSearch').addEventListener('submit',e=>{e.preventDefault();location.href='index.html#search?q='+encodeURIComponent(e.currentTarget.q.value)});
  </script>
</body>
</html>
