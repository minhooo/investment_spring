      const step=max-min>300?100:max-min>180?50:25,start=Math.ceil(min/step)*step;let svg='';

      [0,60,120,250,n-1].filter((v,i,a)=>v<n&&a.indexOf(v)===i).forEach(i=>{svg+=`<line x1="${x(i)}" y1="${y0}" x2="${x(i)}" y2="${y1}" stroke="var(--border)" stroke-dasharray="2 4"/><text x="${x(i)}" y="${y1+22}" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">${D.dates[i].slice(0,7)}</text>`});
      svg+=`<line x1="${x0}" y1="${y(100)}" x2="${x1}" y2="${y(100)}" stroke="var(--strong)" stroke-dasharray="4 4" opacity=".45"/>`;
      series.forEach(([k])=>svg+=`<path d="${path(data[k])}" fill="none" stroke="${colors[k]}" stroke-width="${k==='bundle'?2.8:2}" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`);
      svg+=`<line id="cross" x1="0" y1="${y0}" x2="0" y2="${y1}" stroke="var(--strong)" opacity="0"/><rect id="hit" x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="transparent"/>`;$('#chart').innerHTML=svg;
      $('#chartDescription').textContent=mode==='evaluation'?`${J(BL,'을','를')} 100으로 놓고 가격발견의 방향을 본다.`:'재상장일 종가를 100으로 놓고 실제 매수 이후의 투자성과를 본다.';
      $('#chartNote').textContent=mode==='evaluation'?`주의: ${J(BM,'은','는')} 재상장일 종가=100이다. 두 주식은 ${BL}=100으로 분할 즉시 재평가를 포함한다.`:`모든 계열을 ${S.relist_date} 종가=100으로 맞춰 이후 성과를 같은 기준으로 비교한다.`;
      const hit=$('#hit'),cross=$('#cross'),tip=$('#tip');hit.addEventListener('mousemove',e=>{const r=$('#chart').getBoundingClientRect(),i=Math.max(0,Math.min(n-1,Math.round((e.clientX-r.left)/r.width*(n-1)))),xx=x(i);cross.setAttribute('x1',xx);cross.setAttribute('x2',xx);cross.setAttribute('opacity','1');tip.innerHTML=`<strong class="num">${D.dates[i]}</strong><br>${esc(HN)} ${data.holding[i].toFixed(1)} · ${esc(ON)} ${data.operating[i].toFixed(1)}<br>합산 ${data.bundle[i].toFixed(1)} · ${esc(BM)} ${data.kosdaq[i].toFixed(1)}`;tip.style.display='block';tip.style.left=Math.min(innerWidth-220,e.clientX+12)+'px';tip.style.top=Math.max(8,e.clientY-72)+'px'});hit.addEventListener('mouseleave',()=>{cross.setAttribute('opacity','0');tip.style.display='none'});
    }
    document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw()}));draw();
    $('#headerSearch').addEventListener('submit',e=>{e.preventDefault();location.href='index.html#search?q='+encodeURIComponent(e.currentTarget.q.value)});
  </script>
</body>
</html>
