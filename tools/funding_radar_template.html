<head>

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root{color-scheme:light;--background:#fff;--foreground:#18181b;--card:#fff;--muted:#f4f4f5;--muted-foreground:#71717a;--border:#e4e4e7;--focus-soft:#eef2ff;--primary:#3159c5}*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Malgun Gothic",sans-serif;line-height:1.5;font-variant-numeric:tabular-nums}.topbar{border-bottom:1px solid var(--border);background:var(--card)}.topbar-in{max-width:1180px;margin:auto;padding:13px 22px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}.brand{font-size:18px;font-weight:700;color:var(--foreground);text-decoration:none;white-space:nowrap}.nav{display:flex;gap:4px;flex-wrap:wrap}.nav a{color:var(--muted-foreground);text-decoration:none;padding:8px 10px;border-radius:8px;font-size:14px}.nav a:hover,.nav a[aria-current="page"]{background:var(--muted);color:var(--foreground);font-weight:600}.header-search{margin-left:auto;display:flex;gap:7px;min-width:min(310px,100%)}input,button,select{font:inherit}.header-search input{width:100%;min-width:0;border:1px solid var(--border);border-radius:8px;padding:9px 10px;background:var(--card);color:var(--foreground)}.header-search button{border:1px solid var(--foreground);border-radius:8px;padding:9px 12px;background:var(--foreground);color:#fafafa;cursor:pointer}.topbar a:focus-visible,input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid #52525b;outline-offset:2px}.footer{max-width:1180px;margin:0 auto;padding:0 22px 32px;color:var(--muted-foreground);font-size:12px}.footer p{border-top:1px solid var(--border);padding-top:20px;margin:0}@media(max-width:740px){.topbar-in{padding:12px 16px;gap:12px}.nav{order:3;width:100%}.header-search{order:4;width:100%;flex-basis:100%;margin-left:0}}@media(max-width:440px){.footer{padding-left:16px;padding-right:16px}}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--background:#09090b;--foreground:#fafafa;--card:#18181b;--muted:#27272a;--muted-foreground:#a1a1aa;--border:#27272a;--focus-soft:#1e293b;--primary:#9db7ff}.header-search button{background:#fafafa;color:#18181b;border-color:#fafafa}.kind-CB{background:#332b49;color:#d9c7ff}.kind-RIGHTS{background:#1e3550;color:#b9d8ff}.kind-BW{background:#4a351f;color:#ffd08c}.kind-EB{background:#163d35;color:#9ee5ce}}
    .funding-wrap{max-width:1180px;margin:0 auto;padding:32px 22px 56px}.funding-kicker{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted-foreground);text-transform:uppercase;margin:0 0 8px}.funding-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:20px}.funding-head h1{font-size:clamp(28px,4vw,42px);letter-spacing:-.04em;line-height:1.2;margin:0}.funding-head p{margin:8px 0 0;color:var(--muted-foreground);max-width:740px}.funding-asof{font-size:13px;color:var(--muted-foreground);white-space:nowrap}.radar-tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin:0 0 24px}.radar-tabs a{padding:10px 13px;text-decoration:none;color:var(--muted-foreground);font-weight:650;border-bottom:2px solid transparent}.radar-tabs a[aria-current="page"]{color:var(--foreground);border-color:var(--primary,#3159c5)}.funding-note{padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--muted);font-size:13px;color:var(--muted-foreground);margin:0 0 20px}.funding-note strong{color:var(--foreground)}.funding-subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}.funding-subtabs button{border:1px solid var(--border);background:var(--card);color:var(--foreground);border-radius:999px;padding:8px 12px;cursor:pointer;font:inherit;font-size:14px}.funding-subtabs button[aria-selected="true"]{background:var(--focus-soft);border-color:var(--primary,#3159c5);color:var(--primary,#3159c5)}.funding-panel[hidden]{display:none}.funding-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.funding-kpi{border:1px solid var(--border);background:var(--card);border-radius:12px;padding:16px;min-width:0}.funding-kpi span{display:block;color:var(--muted-foreground);font-size:12px;margin-bottom:8px}.funding-kpi strong{font-size:clamp(20px,2vw,27px);font-variant-numeric:tabular-nums;letter-spacing:-.03em}.funding-kpi small{display:block;margin-top:6px;font-size:12px;color:var(--muted-foreground)}.funding-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:16px;align-items:start}.funding-card{border:1px solid var(--border);background:var(--card);border-radius:12px;padding:18px;min-width:0}.funding-card h2{font-size:17px;margin:0 0 4px}.funding-card h3{font-size:14px;margin:0 0 8px}.funding-card>p{font-size:13px;color:var(--muted-foreground);margin:0 0 16px}.bar-chart{height:266px;display:flex;gap:9px;align-items:end;padding-top:24px;border-bottom:1px solid var(--border);position:relative}.bar-col{flex:1;min-width:34px;height:100%;display:flex;flex-direction:column;justify-content:end;gap:2px}.bar-stack{display:flex;flex-direction:column-reverse;gap:2px;min-height:2px}.bar-stack button{border:0;display:block;width:100%;min-height:2px;padding:0;cursor:pointer;border-radius:3px 3px 1px 1px}.bar-stack button:focus-visible{outline:2px solid var(--foreground);outline-offset:2px}.bar-label{text-align:center;color:var(--muted-foreground);font-size:11px;padding-top:7px;white-space:nowrap}.chart-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted-foreground)}.chart-legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:-1px}.funding-list{display:grid;gap:10px}.signal{border-left:3px solid var(--border);padding:10px 0 10px 12px}.signal strong{font-size:14px}.signal p{font-size:13px;color:var(--muted-foreground);margin:4px 0 0}.signal.growth{border-color:#277a62}.signal.debt{border-color:#bb7b22}.signal.supply{border-color:#7a5aa6}.funding-controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:0 0 16px}.funding-controls label{display:grid;gap:6px;font-size:13px;color:var(--muted-foreground)}.funding-controls select{min-width:150px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--foreground);padding:8px 10px;font:inherit}.funding-count{margin-left:auto;color:var(--muted-foreground);font-size:13px}.funding-table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px}.funding-table{width:100%;min-width:860px;border-collapse:collapse;font-size:13px}.funding-table th{text-align:left;background:var(--muted);font-size:12px;color:var(--muted-foreground);font-weight:650;white-space:nowrap}.funding-table th,.funding-table td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:top}.funding-table tr:last-child td{border-bottom:0}.funding-table button{font:inherit;text-align:left;border:0;background:transparent;color:var(--foreground);padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px}.kind{display:inline-block;border-radius:999px;padding:3px 7px;font-weight:700;font-size:11px;white-space:nowrap}.kind-CB{background:#ebe4fb;color:#65439c}.kind-RIGHTS{background:#dceafa;color:#2a5f9d}.kind-BW{background:#f7ead8;color:#955d15}.kind-EB{background:#e0f1eb;color:#22765e}.purpose{font-size:12px;color:var(--muted-foreground);line-height:1.5}.event-detail{margin:14px 0 0;border:1px solid var(--border);border-radius:10px;background:var(--muted);padding:14px}.event-detail[hidden]{display:none}.event-detail h3{margin:0 0 10px;font-size:16px}.event-detail dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0}.event-detail dt{font-size:11px;color:var(--muted-foreground)}.event-detail dd{font-size:14px;font-variant-numeric:tabular-nums;margin:4px 0 0;word-break:break-word}.event-detail a{color:inherit}.calendar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.calendar section{border:1px solid var(--border);border-radius:10px;padding:14px}.calendar h3{font-size:14px;margin:0 0 7px}.calendar p{margin:0;color:var(--muted-foreground);font-size:12px}.calendar ul{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}.calendar button{width:100%;display:flex;justify-content:space-between;gap:8px;text-align:left;padding:0;border:0;background:transparent;color:var(--foreground);font:inherit;font-size:13px;cursor:pointer}.calendar time{color:var(--muted-foreground);font-variant-numeric:tabular-nums;white-space:nowrap}.history-lead{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(260px,.75fr);gap:16px}.history-stat{border:1px solid var(--border);border-radius:10px;padding:16px}.history-stat strong{display:block;font-size:30px;margin:4px 0}.history-stat p{font-size:13px;color:var(--muted-foreground);margin:0}.source-box{margin-top:16px}.source-box details{border-top:1px solid var(--border);padding-top:12px}.source-box summary{cursor:pointer;font-size:13px;color:var(--muted-foreground)}.source-box ul{font-size:13px;line-height:1.7;margin:8px 0 0;padding-left:18px}.source-box a{color:inherit}@media(max-width:900px){.funding-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.funding-grid,.history-lead{grid-template-columns:1fr}.calendar{grid-template-columns:1fr}.funding-head{align-items:start;flex-direction:column}.funding-asof{white-space:normal}}@media(max-width:600px){.funding-wrap{padding:24px 16px 44px}.funding-kpis{grid-template-columns:1fr}.event-detail dl{grid-template-columns:repeat(2,minmax(0,1fr))}.funding-count{width:100%;margin-left:0}.radar-tabs{overflow:auto}.funding-subtabs{flex-wrap:nowrap;overflow:auto;padding-bottom:2px}.funding-subtabs button{white-space:nowrap}}
  </style>
  <style>.funding-subtabs a{border:1px solid var(--border);background:var(--card);color:var(--foreground);border-radius:999px;padding:8px 12px;cursor:pointer;font:inherit;font-size:14px;text-decoration:none;white-space:nowrap}.funding-subtabs a[aria-current="page"]{background:var(--focus-soft);border-color:var(--primary,#3159c5);color:var(--primary,#3159c5)}@media(max-width:600px){.bar-chart{gap:4px}.bar-col{min-width:0}.bar-label{font-size:10px}}</style>
</head>
<body>
  <header class="topbar"><div class="topbar-in"><a class="brand" href="index.html#home">투자 샘터</a><nav class="nav" aria-label="주요 메뉴"><!--__SITE_NAV__--></nav><form class="header-search spring-search" role="search"><input name="q" type="search" aria-label="통합 검색" placeholder="종목·이슈·테마 검색"><button type="submit">검색</button></form></div></header>
    <main id="content" class="funding-wrap">
      <p class="funding-kicker">Capital flow monitor</p>
      <div class="funding-head"><div><h1>자금 레이더</h1><p>상장사가 어떤 수단으로 자금을 조달하고, 그 돈이 어디에 쓰이며 언제 주식 공급으로 돌아올 수 있는지 추적합니다.</p></div><p id="fundingAsOf" class="funding-asof"></p></div>
      <nav class="radar-tabs" aria-label="레이더 도구"><a href="funding-radar.html" aria-current="page">자금 레이더</a><a href="index-radar.html">지수 레이더</a></nav>
      <p class="funding-note"><strong>현재 범위</strong> · OpenDART 주요사항보고서의 상장사 유상증자·CB·BW·EB <strong>발행결정 공시</strong>입니다. 실제 납입·자금 집행·상환은 아직 포함하지 않습니다.</p>
      <nav class="funding-subtabs" aria-label="자금 레이더 보기"><a href="funding-radar.html" data-tab="overview">시장 현황</a><a href="funding-radar.html?tab=events" data-tab="events">발행 이벤트</a><a href="funding-radar.html?tab=calendar" data-tab="calendar">전환·만기</a><a href="funding-radar.html?tab=history" data-tab="history">History</a></nav>
      <section class="funding-panel" data-panel="overview" role="tabpanel"></section>
      <section class="funding-panel" data-panel="events" role="tabpanel" hidden></section>
      <section class="funding-panel" data-panel="calendar" role="tabpanel" hidden></section>
      <section class="funding-panel" data-panel="history" role="tabpanel" hidden></section>
    </main>
    <footer class="footer"><p>투자 아이디어 샘터는 학습·기록용 개인 아카이브입니다.</p></footer>
  <script>const FUNDING_DATA=/*__FUNDING_DATA__*/null;</script>
  <script>
  (()=>{
    const data=FUNDING_DATA, $=s=>document.querySelector(s), fmt=n=>new Intl.NumberFormat('ko-KR').format(n||0), won=n=>n>=1e12?(n/1e12).toFixed(1)+'조원':(n/1e8).toFixed(0)+'억원';
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const kindColors={RIGHTS:'#5f88c7',CB:'#8262ac',BW:'#d39a4d',EB:'#4b9a80'}, kinds=['RIGHTS','CB','BW','EB'];
    const purposeNames={facility:'시설투자',acquisition:'타법인증권 취득',operations:'운영자금',debt:'채무상환',overseas:'해외투자',other:'기타'};
    const params=()=>new URLSearchParams(location.search); const setParam=(key,value)=>{const u=new URL(location.href);value?u.searchParams.set(key,value):u.searchParams.delete(key);history.replaceState(null,'',u);render();};
    const purposeText=e=>Object.entries(e.proceeds||{}).filter(([,v])=>v).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,v])=>purposeNames[k]+' '+won(v)).join(' · ')||'사용처 미기재';
    const eventRows=(events,limit=events.length)=>events.slice(0,limit).map(e=>`<tr><td><button type="button" data-event="${esc(e.id)}">${esc(e.name)}<br><span class="purpose">${esc(e.stock_code)}</span></button></td><td><span class="kind kind-${e.kind}">${e.kind_label}</span></td><td>${esc(e.decision_date)}<br><span class="purpose">${esc(e.date_basis)}</span></td><td>${won(e.amount)}</td><td class="purpose">${esc(purposeText(e))}</td><td>${e.dilution_pct!=null?e.dilution_pct.toFixed(2)+'%':'—'}</td><td>${e.conversion_start||'—'}</td></tr>`).join('');
    const table=(events,limit)=>`<div class="funding-table-wrap"><table class="funding-table"><thead><tr><th>기업</th><th>수단</th><th>공시·결정일</th><th>결정액</th><th>주요 사용처</th><th>잠재 희석</th><th>전환 시작</th></tr></thead><tbody>${eventRows(events,limit)}</tbody></table></div>`;
    function detail(id){const e=data.events.find(x=>x.id===id);if(!e)return; const box=$('#fundingEventDetail');if(!box)return; box.hidden=false;box.innerHTML=`<h3>${esc(e.name)} · ${esc(e.kind_label)}</h3><dl><div><dt>결정액</dt><dd>${won(e.amount)}</dd></div><div><dt>발행 방식</dt><dd>${esc(e.method||'—')}</dd></div><div><dt>잠재 주식 / 희석률</dt><dd>${e.potential_shares?fmt(e.potential_shares)+'주':''}${e.potential_shares&&e.dilution_pct!=null?' / ':''}${e.dilution_pct!=null?e.dilution_pct.toFixed(2)+'%':'—'}</dd></div><div><dt>전환가액</dt><dd>${e.conversion_price?fmt(e.conversion_price)+'원':'—'}</dd></div><div><dt>전환 가능 기간</dt><dd>${e.conversion_start||'—'}${e.conversion_end?' ~ '+e.conversion_end:''}</dd></div><div><dt>만기</dt><dd>${e.maturity||'—'}</dd></div><div><dt>사용처</dt><dd>${esc(purposeText(e))}</dd></div><div><dt>공시 기준</dt><dd>${esc(e.date_basis)}</dd></div><div><dt>원문</dt><dd>${e.source_url?`<a href="${esc(e.source_url)}" target="_blank" rel="noreferrer">DART 공시 열기</a>`:'—'}</dd></div></dl>`;box.scrollIntoView({block:'nearest',behavior:'smooth'});}
    function overview(){const events=data.events, total=events.reduce((s,e)=>s+e.amount,0), cb=events.filter(e=>e.kind==='CB'), debt=events.reduce((s,e)=>s+(e.proceeds?.debt||0),0), supply=events.filter(e=>e.conversion_start&&e.conversion_start<=data.as_of).reduce((s,e)=>s+(e.potential_shares||0),0);const months=[...new Set(events.map(e=>e.decision_date.slice(0,7)))].sort(), byMonth=months.map(month=>({month,values:kinds.map(kind=>events.filter(e=>e.kind===kind&&e.decision_date.startsWith(month)).reduce((s,e)=>s+e.amount,0))}));const max=Math.max(...byMonth.map(m=>m.values.reduce((a,b)=>a+b,0)),1);const bars=byMonth.map(m=>`<div class="bar-col"><div class="bar-stack">${m.values.map((v,i)=>v?`<button type="button" title="${m.month} · ${TARGET(kinds[i])} ${won(v)}" style="height:${Math.max(3,v/max*210)}px;background:${kindColors[kinds[i]]}" data-kind-jump="${kinds[i]}"></button>`:'').join('')}</div><span class="bar-label">${m.month.slice(5)}월</span></div>`).join('');const cbShare=total?cb.reduce((s,e)=>s+e.amount,0)/total*100:0;return `<div class="funding-kpis"><article class="funding-kpi"><span>공시 결정액</span><strong>${won(total)}</strong><small>${events.length}건 · 기준일 ${data.as_of}</small></article><article class="funding-kpi"><span>CB 결정액</span><strong>${won(cb.reduce((s,e)=>s+e.amount,0))}</strong><small>전체 결정액의 ${cbShare.toFixed(1)}%</small></article><article class="funding-kpi"><span>채무상환 목적</span><strong>${won(debt)}</strong><small>사용처 기재액 합계 기준</small></article><article class="funding-kpi"><span>전환 가능 잠재주식</span><strong>${fmt(supply)}주</strong><small>기준일 이전 전환 개시 CB·BW</small></article></div><div class="funding-grid"><section class="funding-card"><h2>월별 조달수단 이동</h2><p>발행결정 공시액 · 수단별 합산</p><div class="bar-chart">${bars}</div><div class="chart-legend">${kinds.map(k=>`<span><i style="background:${kindColors[k]}"></i>${TARGET(k)}</span>`).join('')}</div></section><aside class="funding-card"><h2>지금 읽을 신호</h2><p>투자판단이 아닌 다음 조사 질문입니다.</p><div class="funding-list"><article class="signal growth"><strong>성장자금 집중</strong><p>시설·증권취득 비중이 높은 업종과 실제 투자처를 공시 원문에서 확인합니다.</p></article><article class="signal debt"><strong>차환 스트레스</strong><p>채무상환·운영자금 비중과 같은 기업의 반복 조달을 함께 봅니다.</p></article><article class="signal supply"><strong>잠재 공급벽</strong><p>전환 시작일, 전환가와 잠재주식 수를 유통물량·주가와 따로 비교합니다.</p></article></div></aside></div><section class="funding-card" style="margin-top:16px"><h2>최근 발행결정</h2><p>기업을 선택하면 공시 조건과 원문을 확인할 수 있습니다.</p>${table(events,8)}<div id="fundingEventDetail" class="event-detail" hidden></div></section>`;}
    function TARGET(kind){return {RIGHTS:'유상증자',CB:'CB',BW:'BW',EB:'EB'}[kind]||kind}
    function events(){const p=params(),kind=p.get('kind')||'',purpose=p.get('purpose')||'',filtered=data.events.filter(e=>(!kind||e.kind===kind)&&(!purpose||(e.proceeds?.[purpose]||0)>0));return `<div class="funding-card"><div class="funding-controls"><label>조달수단<select id="fundingKind"><option value="">전체 수단</option>${kinds.map(k=>`<option value="${k}" ${kind===k?'selected':''}>${TARGET(k)}</option>`).join('')}</select></label><label>주요 사용처<select id="fundingPurpose"><option value="">전체 사용처</option>${Object.entries(purposeNames).map(([k,v])=>`<option value="${k}" ${purpose===k?'selected':''}>${v}</option>`).join('')}</select></label><span class="funding-count">${filtered.length}건 · 발행결정 공시 기준</span></div>${table(filtered)}<div id="fundingEventDetail" class="event-detail" hidden></div></div>`;}
    function calendar(){const candidates=data.events.filter(e=>e.kind==='CB'||e.kind==='BW'),periods=[['이미 전환 가능',e=>e.conversion_start&&e.conversion_start<=data.as_of],['향후 90일 전환 개시',e=>e.conversion_start&&e.conversion_start>data.as_of&&e.conversion_start<=new Date(new Date(data.as_of).getTime()+90*864e5).toISOString().slice(0,10)],['향후 12개월 만기',e=>e.maturity&&e.maturity>=data.as_of&&e.maturity<=new Date(new Date(data.as_of).getTime()+365*864e5).toISOString().slice(0,10)]];return `<div class="funding-card"><h2>전환·만기 캘린더</h2><p>발행결정 공시에 적힌 일정입니다. 실제 전환·상환 또는 주가 영향은 별도 확인이 필요합니다.</p><div class="calendar">${periods.map(([title,test])=>{const rows=candidates.filter(test).sort((a,b)=>(a.conversion_start||a.maturity).localeCompare(b.conversion_start||b.maturity));return `<section><h3>${title}</h3><p>${rows.length}건 · 잠재 공급·상환 조건 확인</p><ul>${rows.slice(0,12).map(e=>`<li><button type="button" data-event="${esc(e.id)}"><span>${esc(e.name)} · <span class="kind kind-${e.kind}">${e.kind_label}</span></span><time>${e.conversion_start||e.maturity}</time></button></li>`).join('')||'<li class="purpose">해당 공시 없음</li>'}</ul></section>`}).join('')}</div><div id="fundingEventDetail" class="event-detail" hidden></div></div>`;}
    function historyPanel(){const counts=Object.fromEntries(kinds.map(k=>[k,data.events.filter(e=>e.kind===k).length]));return `<div class="history-lead"><section class="funding-card"><p class="funding-kicker">2026 자금조달 이동</p><h2>유상증자 심사 강화와 EB 제도 변경 이후, CB를 별도 관찰해야 하는 이유</h2><p>2025년 2월부터 일반주주 권익 훼손 우려가 있는 유상증자 증권신고서는 중점심사 대상이 됐고, 2026년에는 자기주식 대상 EB 발행도 불가해졌습니다. 이 변화가 CB 발행 확대의 유일한 원인이라고 단정할 수는 없지만, 조달수단 선택과 잠재 주식공급을 함께 읽을 필요는 커졌습니다.</p><div class="source-box"><details><summary>근거와 해석의 범위</summary><ul><li><a href="https://www.yna.co.kr/view/AKR20250226151900002" target="_blank" rel="noreferrer">유상증자 중점심사 방향</a> · OFFICIAL 발표를 인용한 보도</li><li><a href="https://fsc.go.kr/po040200/87214?curPage=8&amp;srchBeginDt=&amp;srchCtgry=&amp;srchEndDt=&amp;srchKey=&amp;srchText=" target="_blank" rel="noreferrer">자기주식 대상 EB 관련 규정 정비</a> · OFFICIAL</li><li>위 제도 변화와 CB 확대의 연결은 HYPOTHESIS이며, 이 화면은 발행결정 공시 데이터를 별도로 제시합니다.</li></ul></details></div></section><aside class="history-stat"><span class="purpose">현재 수집 범위 · ${data.as_of}</span><strong>${fmt(data.events.length)}건</strong><p>유증 ${fmt(counts.RIGHTS)}건 · CB ${fmt(counts.CB)}건 · BW ${fmt(counts.BW)}건 · EB ${fmt(counts.EB)}건</p><hr style="border:0;border-top:1px solid var(--border);margin:16px 0"><span class="purpose">다음 연구 질문</span><p>CB가 늘어난 산업에서 시설·M&A 자금이 실제 투자와 매출로 이어지는가, 아니면 채무상환과 차환에 머무는가?</p></aside></div>`;}
    function render(){if(!data)return;$('#fundingAsOf').textContent='공시 수집 기준일 · '+data.as_of;const tab=params().get('tab')||'overview';document.querySelectorAll('[data-panel]').forEach(p=>p.hidden=p.dataset.panel!==tab);document.querySelectorAll('[data-tab]').forEach(b=>{if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});const panel=$(`[data-panel="${tab}"]`);panel.innerHTML=tab==='overview'?overview():tab==='events'?events():tab==='calendar'?calendar():historyPanel();document.querySelectorAll('[data-event]').forEach(b=>b.addEventListener('click',()=>detail(b.dataset.event)));document.querySelectorAll('[data-kind-jump]').forEach(b=>b.addEventListener('click',()=>{const u=new URL(location.href);u.searchParams.set('tab','events');u.searchParams.set('kind',b.dataset.kindJump);location.href=u.pathname+u.search}));$('#fundingKind')?.addEventListener('change',e=>setParam('kind',e.target.value));$('#fundingPurpose')?.addEventListener('change',e=>setParam('purpose',e.target.value));}
    document.querySelector('.spring-search')?.addEventListener('submit',e=>{e.preventDefault();location.href='index.html#search?q='+encodeURIComponent(e.currentTarget.q.value)});render();
  })();
  </script>
</body>
